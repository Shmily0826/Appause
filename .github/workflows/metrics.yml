name: Update GitHub metrics

on:
  schedule:
    # Every Sunday at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run metrics script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_REPO: Shmily0826/Appause
          WORKER_STATS_URL: ${{ secrets.WORKER_STATS_URL }}
        run: python scripts/github_metrics.py

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add METRICS.md METRICS.csv
          git commit -m "metrics: weekly snapshot $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
