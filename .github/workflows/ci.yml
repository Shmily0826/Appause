name: CI

# Every push to main and every PR must pass both unit-test variants, lint both
# build variants, compile the debug APK, and run the Worker test suite.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (debug and release)
        run: ./gradlew testDebugUnitTest testReleaseUnitTest

      - name: Lint (debug and release)
        run: ./gradlew lintDebug lintRelease

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          if-no-files-found: ignore

  # The Worker has no build step and needs no dependencies: these three files run
  # on plain Node, so the job is a single command. It exists because the Worker
  # is the only part of the project with no other automated coverage, and it is
  # never deployed by CI (deployment stays a manual step).
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker tests
        working-directory: worker
        run: |
          node test/sign-verify.mjs
          node test/redeem-failure-modes.mjs
          node test/download-redirect.mjs
