name: CI

# Every push to main and every PR must pass both unit-test variants, lint both
# build variants, and compile the debug APK.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (debug and release)
        run: ./gradlew testDebugUnitTest testReleaseUnitTest

      - name: Lint (debug and release)
        run: ./gradlew lintDebug lintRelease

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          if-no-files-found: ignore
