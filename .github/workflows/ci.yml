name: CI

# Every push to main and every PR must pass the unit-test suite and compile
# the debug APK. This is the project's only automated regression gate — the
# 134 JVM tests pin the interception decision logic that historically broke
# (v0.5.11–v0.5.27), so it must never be skipped.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          if-no-files-found: ignore
